name: Generate Edge Keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gen-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Generate JKS keystore
        run: |
          keytool -genkeypair -v \
            -keystore /tmp/edge.jks \
            -alias edge \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "Edge#Browser2026" \
            -keypass "Edge#Browser2026" \
            -dname "CN=Edge, OU=Browser, O=Edge, L=NA, S=NA, C=IN"
          echo "B64=$(base64 -w0 /tmp/edge.jks)" >> "$GITHUB_ENV"
          echo "Keystore generated OK"

      - name: Set GitHub secrets
        env:
          GH_TOKEN: ${{ secrets.REPO_TOKEN }}
          B64: ${{ env.B64 }}
        run: |
          gh secret set KEYSTORE_B64 --body "$B64" --repo nilow9950/Kosua
          gh secret set STORE_PASS --body "Edge#Browser2026" --repo nilow9950/Kosua
          gh secret set KEY_ALIAS --body "edge" --repo nilow9950/Kosua
          echo "Secrets set successfully"
