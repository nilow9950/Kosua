name: Build and Release Edge

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.6.0)'
        required: true
        default: 'v1.6.0'

env:
  GRADLE_VERSION: '8.5'
  ANDROID_SDK_VERSION: '34.0.0'
  EDGE_REPO: 'nilow9950/Edge'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Edge repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.EDGE_REPO }}
          fetch-depth: 0
          token: ${{ secrets.EDGE_REPO_PAT }}
          path: edge-app
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      
      - name: Generate Gradle Wrapper
        run: |
          echo "Generating gradle wrapper..."
          cd edge-app
          gradle wrapper --gradle-version 8.5
      
      - name: Build release APK
        run: |
          echo "Building release APK..."
          cd edge-app
          ./gradlew assembleRelease --stacktrace --info
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          STORE_PASS: ${{ secrets.STORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: edge-release-apk
          path: edge-app/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
      
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: edge-app/app/build/outputs/apk/release/app-release-unsigned.apk
          name: v1.6.5
          tag_name: v1.6.5
          repository: ${{ env.EDGE_REPO }}
          body: |
            ## 🔐 Edge v1.6.5 - Security Update
            
            ### New Security Features
            - ✅ **Integrity Checking** - Detects root, Lucky Patcher, APK tampering
            - ✅ **Forced Updates** - Hard update wall until new version installed
            - ✅ **Password Hashing** - Removed hardcoded password, added SHA-256 hashing with salt
            - ✅ **Biometric Authentication** - Fingerprint/Face unlock support
            - ✅ **Encrypted Storage** - All sensitive data encrypted with AES-256-GCM
            - ✅ **Component Protection** - Blocks component disabling
            - ✅ **Permission Monitoring** - Detects permission revocation
            
            ### UI Improvements
            - 🎨 Premium Material Design 3 theme
            - 🎨 Enhanced lock screen with better typography
            - 🎨 Rounded corners and premium color scheme
            - 🎨 Loading indicators and visual feedback
            
            ### Optimization
            - 📦 APK compression enabled
            - 🚀 ProGuard optimization
            - 📉 Smaller APK size with ABI splits
            
            ### Technical Details
            - Version Code: 16
            - Min SDK: 26 (Android 8.0)
            - Target SDK: 34 (Android 14)
            - Compile SDK: 34
            
            ### Full Changelog
            See [RELEASE_NOTES.md](RELEASE_NOTES.md)
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
