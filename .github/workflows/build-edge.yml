name: Build and Release Edge

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.6.7)'
        required: true
        default: 'v1.6.7'

env:
  GRADLE_VERSION: '8.7'
  ANDROID_SDK_VERSION: '34.0.0'
  EDGE_REPO: 'nilow9950/Edge'
  SECURE_APP_REPO: 'nilow9950/secure-app'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Edge repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.EDGE_REPO }}
          fetch-depth: 0
          token: ${{ secrets.EDGE_REPO_PAT }}
          path: edge-app
      
      - name: Checkout secure-app repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SECURE_APP_REPO }}
          fetch-depth: 0
          path: secure-app
          token: ${{ secrets.SECURE_APP_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install secure-app dependencies
        run: |
          cd secure-app
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt -q
          fi
          pip install requests pyyaml -q
          ls -la tools/
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      
      - name: Generate Gradle Wrapper
        run: |
          echo "Generating gradle wrapper..."
          cd edge-app
          gradle wrapper --gradle-version 8.7

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > edge-app/app/release.keystore

      - name: Fetch tools
        run: |
          curl -sL -o /tmp/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          curl -sL -o /tmp/r8.jar https://dl.google.com/dl/android/maven2/com/android/tools/r8/8.3.37/r8-8.3.37.jar
          curl -sL -o /tmp/dex-tools.zip https://github.com/pxb1988/dex2jar/releases/download/v2.4/dex-tools-v2.4.zip
          unzip -q /tmp/dex-tools.zip -d /tmp/d2j
          chmod +x /tmp/d2j/dex-tools-v2.4/d2j-dex2jar.sh
          AJ=$(ls "$ANDROID_HOME"/platforms/android-*/android.jar | sort -V | tail -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          echo "ANDROID_JAR=$AJ" >> "$GITHUB_ENV"
          echo "APKSIGNER=${BT}apksigner" >> "$GITHUB_ENV"
          echo "ZIPALIGN=${BT}zipalign" >> "$GITHUB_ENV"
          echo "DEX2JAR=/tmp/d2j/dex-tools-v2.4/d2j-dex2jar.sh" >> "$GITHUB_ENV"

      - name: Run secure-app harden pipeline
        env:
          STORE_PASS: ${{ secrets.STORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          LOG_KEY: ${{ secrets.LOG_KEY }}
        run: |
          echo "Running secure-app harden pipeline..."
          cd secure-app
          set -x
          python3 tools/harden.py \
            --config config/edge.json \
            --apk ../edge-app/app/build/outputs/apk/release/app-release.apk \
            --out /tmp/secure.apk \
            --apktool /tmp/apktool.jar \
            --r8 /tmp/r8.jar \
            --dex2jar "$DEX2JAR" \
            --android-jar "$ANDROID_JAR" \
            --zipalign "$ZIPALIGN" \
            --apksigner "$APKSIGNER" \
            --keystore ../edge-app/app/release.keystore \
            --ks-pass "$STORE_PASS" \
            --alias "$KEY_ALIAS" 2>&1 || {
            echo "ERROR: harden.py failed"
            exit 1
          }
          cd ..
      
      - name: Run secure-app guard injection
        run: |
          echo "Running secure-app guard injection..."
          cd secure-app
          python3 tools/guardlib.py --app-dir ../edge-app/app
          cd ..
      
      - name: Build release APK
        run: |
          echo "Building release APK with security features..."
          cd edge-app
          ./gradlew assembleRelease --stacktrace --info
        env:
          KEYSTORE: release.keystore
          STORE_PASS: ${{ secrets.STORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: edge-release-apk
          path: edge-app/app/build/outputs/apk/release/*.apk
          retention-days: 30
      
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          files: edge-app/app/build/outputs/apk/release/*.apk
          name: ${{ github.event.inputs.version || 'v1.6.7' }}
          tag_name: ${{ github.event.inputs.version || 'v1.6.7' }}
          repository: ${{ env.EDGE_REPO }}
          body: |
            ## 🔐 Edge v${{ github.event.inputs.version || 'v1.6.7' }} - Security Update
            
            ### New Security Features
            - ✅ **Integrity Checking** - Detects root, Lucky Patcher, APK tampering
            - ✅ **Guard Protection** - Debugger detection, Frida blocking, trace detection
            - ✅ **String Encryption** - All sensitive strings encrypted at runtime
            - ✅ **Crash Logging** - Private crash reports in cache directory
            - ✅ **Component Protection** - Blocks component disabling
            - ✅ **Permission Monitoring** - Detects permission revocation
            - ✅ **Encrypted Storage** - All sensitive data encrypted with AES-256-GCM
            
            ### UI Improvements
            - 🎨 Premium Material Design 3 theme
            - 🎨 Enhanced lock screen with better typography
            - 🎨 Rounded corners and premium color scheme
            - 🎨 Loading indicators and visual feedback
            
            ### Optimization
            - 📦 APK compression enabled
            - 🚀 R8 ProGuard optimization
            - 📉 Smaller APK size with ABI splits
            
            ### Technical Details
            - Version Code: 17
            - Min SDK: 26 (Android 8.0)
            - Target SDK: 34 (Android 14)
            - Compile SDK: 34
            
            ### Full Changelog
            See [RELEASE_NOTES.md](RELEASE_NOTES.md)
          draft: false
          prerelease: false
          token: ${{ secrets.EDGE_REPO_PAT }}
