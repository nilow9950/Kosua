name: Perm test (location ask on fresh install)
on:
  workflow_dispatch:
    inputs:
      tag:
        description: pc-share release tag (blank = latest)
        required: false
        default: ''
permissions:
  contents: read
jobs:
  permtest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 33]
    steps:
      - name: Enable KVM
        run: echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules && sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Download APK
        env:
          GH_TOKEN: ${{ secrets.XBOX_REPO_TOKEN }}
        run: |
          set -e
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG=$(gh api repos/nilow9950/pc-share/releases/latest --jq .tag_name </dev/null); fi
          echo "tag=$TAG"
          mkdir -p apks
          gh release download "$TAG" --repo nilow9950/pc-share --pattern 'PC-Share.apk' --dir apks </dev/null
          sha256sum apks/*.apk
      - name: Fresh install then START then location dialog
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            echo "=== api ${{ matrix.api-level }} ==="; adb wait-for-device; adb shell input keyevent 82 || true
            printf '%s\n' '#!/bin/sh' 'adb shell uiautomator dump /sdcard/u.xml >/dev/null 2>&1' 'adb shell cat /sdcard/u.xml > /tmp/u.xml 2>/dev/null' 'H=$(grep -o "<node[^>]*>" /tmp/u.xml | grep -E "$1" | head -1)' 'B=$(printf "%s" "$H" | grep -o "bounds=\"[^\"]*\"" | grep -o "[0-9-][0-9-]*")' 'set -- $B' 'X=$(( ($1+$3)/2 ))' 'Y=$(( ($2+$4)/2 ))' 'echo "TAP [$1,$2][$3,$4] -> $X,$Y"' 'adb shell input tap $X $Y' > /tmp/tap.sh; chmod +x /tmp/tap.sh; cat /tmp/tap.sh
            adb uninstall com.nextec.pcshare || true; adb install apks/PC-Share.apk || true
            adb shell monkey -p com.nextec.pcshare -c android.intent.category.LAUNCHER 1 || true; sleep 12; adb shell pidof com.nextec.pcshare && echo INSTALL_LAUNCH_OK || echo INSTALL_LAUNCH_DEAD
            adb shell uiautomator dump /sdcard/s0.xml >/dev/null 2>&1; adb shell cat /sdcard/s0.xml > /tmp/s0.xml; echo "--- first screen:"; grep -o 'text="[^"]*"' /tmp/s0.xml | head -25
            /tmp/tap.sh 'text="Got it"|text="GOT IT"|resource-id="com.nextec.pcshare:id/tipsDone"'; sleep 3
            adb shell uiautomator dump /sdcard/s0b.xml >/dev/null 2>&1; adb shell cat /sdcard/s0b.xml > /tmp/s0b.xml; echo "--- after guide dismiss:"; grep -o 'text="[^"]*"' /tmp/s0b.xml | head -25
            /tmp/tap.sh 'resource-id="com.nextec.pcshare:id/powerBtn"'; sleep 3
            adb shell uiautomator dump /sdcard/s1.xml >/dev/null 2>&1; adb shell cat /sdcard/s1.xml > /tmp/s1.xml; echo "--- after 1st START:"; grep -o 'text="[^"]*"' /tmp/s1.xml | head -25
            grep -qi "Storage access needed" /tmp/s1.xml && echo "STORAGE_DIALOG_OK" || echo "STORAGE_DIALOG_MISSING"
            adb shell appops set com.nextec.pcshare MANAGE_EXTERNAL_STORAGE allow || true; echo "manager=$(adb shell appops get com.nextec.pcshare MANAGE_EXTERNAL_STORAGE 2>/dev/null)"
            adb shell am force-stop com.nextec.pcshare; sleep 2; adb shell monkey -p com.nextec.pcshare -c android.intent.category.LAUNCHER 1 || true; sleep 10; adb shell pidof com.nextec.pcshare && echo RELAUNCH_OK || echo RELAUNCH_DEAD
            /tmp/tap.sh 'resource-id="com.nextec.pcshare:id/powerBtn"'; sleep 3
            adb shell uiautomator dump /sdcard/s2.xml >/dev/null 2>&1; adb shell cat /sdcard/s2.xml > /tmp/s2.xml; echo "--- after 2nd START:"; grep -o 'text="[^"]*"' /tmp/s2.xml | head -30
            grep -qi "location" /tmp/s2.xml && echo "LOC_DIALOG_OK" || echo "LOC_DIALOG_MISSING"
            grep -qi "notification" /tmp/s2.xml && echo "NOTIF_DIALOG_PRESENT" || echo "NOTIF_DIALOG_ABSENT"
            grep -qi "notification" /tmp/s2.xml && { /tmp/tap.sh 'text="Allow"|text="ALLOW"'; sleep 3; adb shell uiautomator dump /sdcard/s3.xml >/dev/null 2>&1; adb shell cat /sdcard/s3.xml > /tmp/s3.xml; echo "--- after notif answer:"; grep -o 'text="[^"]*"' /tmp/s3.xml | head -30; grep -qi "location" /tmp/s3.xml && echo "LOC_DIALOG_OK_AFTER_NOTIF" || echo "LOC_DIALOG_MISSING_AFTER_NOTIF"; } || true
            echo "--- location perm state:"; adb shell dumpsys package com.nextec.pcshare | grep -i "ACCESS_FINE_LOCATION" | head -5 || true
            echo "--- crash:"; adb logcat -d -s AndroidRuntime:E | tail -10 || true
            echo "PERMTEST_DONE"
